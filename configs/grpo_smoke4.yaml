# GRPO on fruit-bench: smoke run 4 (= smoke 3 except: PG on text tokens only, audio KL beta 0.2, stricter overlap). Every value here is logged with the run.
run_name: grpo_smoke4
seed: 1
steps: 20

model:
  hf_repo: kyutai/moshiko-pytorch-bf16
  lora_rank: 64
  lora_scaling: 2.0          # moshi-finetune default; LoRA B starts at zero -> step 0 == base Moshi
  gradient_checkpointing: true

rollout:
  starts_per_step: 4         # one start (group) per GPU
  group_size: 16             # games per start
  n_user_fruits: 12         # v3: training games have 12 user turns, like evaluation
  split: train
  # Sampling: Moshi defaults (temp 0.8 audio / 0.7 text, top-k 250 / 25). Raise only if the
  # within-group spread collapses.
  temp: null
  temp_text: null
  save_audio_every: 10       # keep WAVs of the training games every N steps (for listening)

reward:                      # per scored Moshi turn (reward v3, see results/LOG.md); validation uses the same
  scorer: v3                 # valid = bare fruit name only ("Mango.", "A mango!", "Dragon fruit."); any other
                             # reply with one new fruit is "sentence"; common-sense fruit list
  valid: 1.0
  fast_bonus: 0.2            # added to valid if fast_latency_min <= latency <= fast_latency
  fast_latency_min: 0.0
  fast_latency: 1.0
  sentence: -0.1             # v3: one new fruit inside other words ("I'll go with mango", "Um, mango")
  filler: -0.3
  silent: -0.3
  repeat: -0.5               # includes echoing the user's fruit
  non_fruit: -0.3
  multi_new: -0.1            # v3: was 0.0 (more than one fruit, at least one new)
  multi_no_new: -0.3
  overlap: -1.0              # v4: was -0.8; Moshi speech during the user's line
  overlap_grace: 0.1         # v4: was 0.2; ignore Moshi words starting in the last 0.1 s of a user line
  valid_overlap_cap: 0.0     # v4: was +0.2; a valid fruit with counted overlap is capped at 0.0 total
  long_turn_free_words: 3    # -0.05 per word beyond 3 words in the turn, all classes ...
  long_turn_per_word: -0.05
  long_turn_cap: -0.5        # ... at most -0.5

update:
  adv_eps: 1.0e-4            # advantage = (r - mean_turn_index) / (std_turn_index + eps)
  clip: 0.2
  minibatches: 4             # one pass over the step's games, split into 4 optimizer steps
  micro_batch: 4             # games per forward/backward
  kl_beta: 0.04              # k3 KL to the reference = same model with LoRA disabled (fallback)
  kl_beta_text: 0.04         # v4: KL on text tokens
  kl_beta_audio: 0.2         # v4: KL on audio tokens (stronger: keep Moshi's voice close to base)
  text_weight: 1.0           # policy-gradient weight on text tokens
  audio_weight: 0.0          # v4: no policy gradient on audio tokens (KL only)
  logprob_temperature: true  # score tokens with the sampling temperatures (text 0.7, audio 0.8)
  lr: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.95]
  grad_clip: 1.0

checkpoint_every: 10
val:
  every: 10                  # v4: steps 0, 10, 20
  padded_whisper: false      # not needed (user)
  n_games: 100
  n_user_fruits: 12
  seed: 7
  whisper_games: 10
  whisper_min_agreement: 0.90
